name: Django checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grocery
          POSTGRES_PASSWORD: grocery_test_only
          POSTGRES_DB: grocery
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grocery"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: GROCERY.test_settings
      TEST_DATABASE_URL: postgres://grocery:grocery_test_only@localhost:5432/grocery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
